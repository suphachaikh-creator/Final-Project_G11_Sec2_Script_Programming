name: CI

on:
  push:
    # tag อย่าง v1.0.1 ให้ release.yml เรียกงานนี้เอง จะได้ไม่รันซ้ำสองรอบ
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # ให้ workflow อื่น (release.yml) เรียกใช้ขั้นตอน lint + test ชุดเดียวกันได้
  workflow_call:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Test (pytest + coverage)
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
