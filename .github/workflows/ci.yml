name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Test (${{ matrix.sprint }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sprint: [Sprint1, Sprint2]

    defaults:
      run:
        working-directory: ${{ matrix.sprint }}/code

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.sprint }}/code/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Test (pytest)
        run: python -m pytest -q
